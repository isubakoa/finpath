name: Scrape LI coverage (JobSpy)

# Every hour, 24/7 — tightened from every 2 hours in September 2026
# specifically to shrink the gap between a role going live on LI and
# this scraper's next chance to find it, since index.php's Today tab gates
# on freshness (originally calendar-day-posted; since 2026-09-23, a rolling
# 24h window from first-seen — see README.md's "How the rotation works" and
# scrape.py's module docstring for the full reasoning). This cron interval
# (SCHEDULE_INTERVAL_HOURS below) is unchanged as of 2026-09-24 — both of
# that day's rotation-speed changes were made entirely in scrape.py: the
# 950-combo grid was trimmed to 570 (LOCATIONS 25 -> 15, your explicit
# market picks, to cut load/block-risk) and COMBOS_PER_RUN was set to 95 so
# the new, smaller grid still completes a full cycle every 6h. Combined
# daily request volume across LI/Indeed/Glassdoor/Google is now ~2,280 LI
# requests/day at that same 6h cycle — up from the original 950-combo/
# 60-per-run baseline's ~1,440/day, but a real ~40% CUT from the ~3,840/day
# a same-day-earlier round had briefly set (950 combos at 160/run) before
# this location trim replaced it: shrinking the grid was banked entirely as
# lower daily volume rather than an even faster cycle — see scrape.py's
# COMBOS_PER_RUN comment for the full reasoning and the runtime-overlap
# constraint that shaped the choice. IMPORTANT: this cron value is read
# directly by scrape.py's rotation logic (SCHEDULE_INTERVAL_HOURS, must
# match this cron) to figure out which chunk of the full combination search
# grid to run each time — changing this value here without also updating
# SCHEDULE_INTERVAL_HOURS in scrape.py will throw the rotation off (it'll
# still run fine, just skip or repeat chunks unevenly). See scrape.py's
# module docstring.
on:
  schedule:
    - cron: "0 * * * *"
  push:
    paths:
      - "li-scraper/scrape.py"
      - "li-scraper/match.py"
      - "li-scraper/companies.py"
      - "li-scraper/requirements.txt"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: li-scraper
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run offline matching tests
        run: python test_match.py

      - name: Run offline rotation/merge tests
        run: python test_rotation.py

      - name: Run scraper
        run: python scrape.py

      - name: Commit updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add li-snapshot.json
          git diff --staged --quiet && echo "No changes to commit." && exit 0
          git commit -m "Refresh li-snapshot.json"
          git push
