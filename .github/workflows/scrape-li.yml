# li-scraper: LinkedIn / Indeed / welcome-to-nl / uxwork -> data/li-snapshot.json
#
# Scheduling: GitHub's `schedule` trigger is best-effort and routinely drops or
# delays runs (we saw 5-7h gaps on a 2h cron). So the cron fires every 15
# minutes and the first step is a cheap gate that only lets the real run
# through once SCHEDULE_INTERVAL_HOURS have passed since data/li-snapshot.json
# was last committed. Self-healing: the next tick that fires after the
# interval does the work. LinkedIn searches only what's new since each search
# last completed, and Indeed picks its rotation chunk from wall-clock time, so
# skipped ticks don't lose coverage. Off-minute offsets (3/18/33/48)
# avoid GitHub's congested top-of-hour.
#
# Tuning what each run searches (markets, terms, combos per run) happens in
# scrape.py, not here. SCHEDULE_INTERVAL_HOURS below must match scrape.py's.
name: Scrape LI-Coverage

on:
  schedule:
    - cron: "3,18,33,48 * * * *"
  push:
    paths:
      - "li-scraper/scrape.py"
      - "li-scraper/match.py"
      - "li-scraper/companies.py"
      - "li-scraper/requirements.txt"
      - "li-scraper/linkedin_guest.py"
      - "li-scraper/uxwork.py"
      - "data/companies.json"
  workflow_dispatch: {}

concurrency:
  group: scrape-li
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: li-scraper
    steps:
      # Runs before checkout (asks the REST API for the snapshot's last commit),
      # so a skipped tick costs seconds. Same gate as scrape.yml's.
      - name: Gate on elapsed time since last real run
        id: gate
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SNAPSHOT_PATH: data/li-snapshot.json
          SCHEDULE_INTERVAL_HOURS: "2" # must match li-scraper/scrape.py's SCHEDULE_INTERVAL_HOURS
        run: |
          set -euo pipefail
          RESP=$(curl -sS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits?path=${SNAPSHOT_PATH}&sha=main&per_page=1")
          LAST_ISO=$(echo "$RESP" | jq -r 'if (type == "array") and (length > 0) then .[0].commit.committer.date else "" end')
          if [ -z "$LAST_ISO" ]; then
            echo "No prior commit found for $SNAPSHOT_PATH on main — treating as first-ever run."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            LAST_EPOCH=$(date -u -d "$LAST_ISO" +%s)
            NOW_EPOCH=$(date -u +%s)
            ELAPSED=$(( NOW_EPOCH - LAST_EPOCH ))
            THRESHOLD=$(( SCHEDULE_INTERVAL_HOURS * 3600 ))
            echo "Last commit to $SNAPSHOT_PATH: $LAST_ISO (${ELAPSED}s ago; threshold ${THRESHOLD}s)"
            if [ "$ELAPSED" -ge "$THRESHOLD" ]; then
              echo "should_run=true" >> "$GITHUB_OUTPUT"
            else
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              echo "Only ${ELAPSED}s since the last real run — skipping this check-in."
            fi
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.should_run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.should_run == 'true'
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.gate.outputs.should_run == 'true'
        run: pip install -r requirements.txt

      - name: Install Chromium (Playwright, for uxwork)
        if: steps.gate.outputs.should_run == 'true'
        run: playwright install --with-deps chromium

      - name: Validate companies.json
        if: steps.gate.outputs.should_run == 'true'
        run: python test_companies_json.py

      - name: Run offline matching tests
        if: steps.gate.outputs.should_run == 'true'
        run: python test_match.py

      - name: Run offline rotation/merge tests
        if: steps.gate.outputs.should_run == 'true'
        run: python test_rotation.py

      - name: Run offline LinkedIn/Indeed tests
        if: steps.gate.outputs.should_run == 'true'
        run: python test_linkedin.py

      - name: Run offline uxwork tests
        if: steps.gate.outputs.should_run == 'true'
        run: python test_uxwork.py

      - name: Run scraper
        if: steps.gate.outputs.should_run == 'true'
        run: python scrape.py

      # This run's commit only touches data/li-snapshot.json, so if main moved
      # meanwhile (scrape.yml or a person pushed), rebasing onto it can't
      # conflict — retry the push a few times instead of losing the run.
      - name: Commit updated snapshot
        if: steps.gate.outputs.should_run == 'true'
        working-directory: .
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/li-snapshot.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Refresh li-snapshot.json"
          attempts=6
          for attempt in $(seq 1 "$attempts"); do
            if git push; then
              echo "Pushed on attempt $attempt/$attempts."
              exit 0
            fi
            if [ "$attempt" -eq "$attempts" ]; then
              break
            fi
            echo "Push rejected on attempt $attempt/$attempts — main moved since checkout. Rebasing onto origin/main and retrying..."
            git fetch origin main
            if ! git rebase origin/main; then
              echo "::error::Unexpected rebase conflict while replaying the li-snapshot.json commit — something else changed data/li-snapshot.json on main. Aborting rather than guessing."
              git rebase --abort
              exit 1
            fi
            sleep $(( (RANDOM % 20) + 5 ))
          done
          echo "::error::Failed to push after $attempts attempts — main kept moving. This run's snapshot was NOT saved."
          exit 1
