name: Scrape LI coverage (JobSpy)

# 2026-09-25 — backed off from hourly-at-minute-0 to every 3 hours, offset to
# minute 13, after the hourly schedule turned out to fire wildly irregularly
# in practice: commit history on main showed gaps anywhere from 45 minutes to
# nearly 6 hours between runs, and at least one run number (out of #118-121)
# never showed up in the Actions run list at all. Root cause, as far as it
# could be confirmed without direct Actions-API access: GitHub's own
# scheduler is documented to delay or silently DROP `schedule` triggers
# anchored at the top of the hour (minute 0), since every workflow on GitHub
# scheduled that way competes for the same "high load" window — see
# https://docs.github.com/actions/using-workflows/events-that-trigger-workflows#schedule.
# Moving off :00 (minute 13 here) avoids that specific congestion point;
# backing off from hourly to every 3h also just means fewer chances to
# collide with it and less total Actions-minutes burned. Both changes were
# made together deliberately, at the user's explicit choice, over just the
# minute-offset fix alone.
#
# Previously: every hour, 24/7 — tightened from every 2 hours in September
# 2026 specifically to shrink the gap between a role going live on LI and
# this scraper's next chance to find it, since index.php's Today tab gates
# on freshness (originally calendar-day-posted; since 2026-09-23, a rolling
# 24h window from first-seen — see README.md's "How the rotation works" and
# scrape.py's module docstring for the full reasoning). As of 2026-09-24, the
# 950-combo grid was trimmed to 570 (LOCATIONS 25 -> 15, your explicit market
# picks, to cut load/block-risk) and COMBOS_PER_RUN was set to 95 so the grid
# divides into exactly 6 chunks; at the (now-reverted) hourly cadence that
# was a 6h full-rotation cycle at ~2,280 LI requests/day. At today's 3h
# cadence, with COMBOS_PER_RUN left unchanged (a separate lever — see
# scrape.py's COMBOS_PER_RUN comment — not touched by this round), the same
# 6-chunk grid now takes ~18h to fully rotate instead of 6h, and daily LI
# request volume drops to roughly a third of the ~2,280/day figure above. If
# that rotation speed or request volume ever needs tuning back up, raise
# COMBOS_PER_RUN rather than re-tightening the cron — see that comment for
# the runtime-overlap constraint that limits how high it can safely go.
# IMPORTANT: this cron value is read directly by scrape.py's rotation logic
# (SCHEDULE_INTERVAL_HOURS, must match this cron's *interval* — the hour
# spacing, not the minute offset) to figure out which chunk of the full
# combination search grid to run each time — changing the interval here
# without also updating SCHEDULE_INTERVAL_HOURS in scrape.py will throw the
# rotation off (it'll still run fine, just skip or repeat chunks unevenly).
# See scrape.py's module docstring.
on:
  schedule:
    - cron: "13 */3 * * *"
  push:
    paths:
      - "li-scraper/scrape.py"
      - "li-scraper/match.py"
      - "li-scraper/companies.py"
      - "li-scraper/requirements.txt"
      - "li-scraper/bayt_playwright.py" # 2026-09-24: Bayt's dedicated Playwright scraper, see scrape.py's module docstring
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: li-scraper
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 2026-09-24: needed for bayt_playwright.py — JobSpy's own Bayt
      # integration is blocked outright (403 on every request, confirmed
      # from both GitHub Actions and a real home IP — see scrape.py's
      # module docstring), so Bayt is now scraped directly via a real
      # headless Chromium browser instead. `pip install playwright` alone
      # only installs the Python package; the browser binary itself still
      # needs this separate step, same as js-scraper's own
      # `npx playwright install --with-deps chromium` step in
      # .github/workflows/scrape.yml (the Node equivalent of this same
      # requirement, already proven working in this repo).
      - name: Install Chromium (Playwright)
        run: playwright install --with-deps chromium

      - name: Run offline matching tests
        run: python test_match.py

      - name: Run offline rotation/merge tests
        run: python test_rotation.py

      # 2026-09-24: covers bayt_playwright.py's own logic (URL/date helpers,
      # DOM-extraction-to-row transform) plus scrape.py's wiring to it, via
      # a fake browser/page object — no real network or installed Chromium
      # needed, so this runs alongside the existing offline test steps above
      # rather than needing the Chromium-install step to have happened
      # first. (A matching Glassdoor-Playwright test step lived here too,
      # briefly — removed 2026-09-24 along with glassdoor_playwright.py
      # itself; see scrape.py's module docstring, "GLASSDOOR: RETIRED".)
      - name: Run offline Bayt-Playwright tests
        run: python test_bayt_playwright.py

      - name: Run scraper
        run: python scrape.py

      - name: Commit updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add li-snapshot.json
          git diff --staged --quiet && echo "No changes to commit." && exit 0
          git commit -m "Refresh li-snapshot.json"
          git push
