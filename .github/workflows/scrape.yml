# js-scraper: JavaScript-only careers boards -> data/js-snapshot.json
#
# Same scheduling pattern as scrape-li.yml (see its header): a 15-minute cron
# plus an elapsed-time gate, because GitHub drops and delays scheduled runs.
# Offsets 8/23/38/53 keep it away from scrape-li.yml's ticks and the top of
# the hour. Also runs on any push that changes the scraper.
name: Scrape JS-only career sites

on:
  schedule:
    - cron: "8,23,38,53 * * * *"
  push:
    paths:
      - "js-scraper/scrape.js"
      - "js-scraper/package.json"
  workflow_dispatch: {}

concurrency:
  group: scrape-js
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      # Runs before checkout, so a skipped tick costs seconds. Same gate as scrape-li.yml's.
      - name: Gate on elapsed time since last real run
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SNAPSHOT_PATH: data/js-snapshot.json
          SCHEDULE_INTERVAL_HOURS: "2"
        run: |
          set -euo pipefail
          RESP=$(curl -sS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits?path=${SNAPSHOT_PATH}&sha=main&per_page=1")
          LAST_ISO=$(echo "$RESP" | jq -r 'if (type == "array") and (length > 0) then .[0].commit.committer.date else "" end')
          if [ -z "$LAST_ISO" ]; then
            echo "No prior commit found for $SNAPSHOT_PATH on main — treating as first-ever run."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            LAST_EPOCH=$(date -u -d "$LAST_ISO" +%s)
            NOW_EPOCH=$(date -u +%s)
            ELAPSED=$(( NOW_EPOCH - LAST_EPOCH ))
            THRESHOLD=$(( SCHEDULE_INTERVAL_HOURS * 3600 ))
            echo "Last commit to $SNAPSHOT_PATH: $LAST_ISO (${ELAPSED}s ago; threshold ${THRESHOLD}s)"
            if [ "$ELAPSED" -ge "$THRESHOLD" ]; then
              echo "should_run=true" >> "$GITHUB_OUTPUT"
            else
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              echo "Only ${ELAPSED}s since the last real run — skipping this check-in."
            fi
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.should_run == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.should_run == 'true'
        with:
          node-version: 22

      - name: Install dependencies
        if: steps.gate.outputs.should_run == 'true'
        working-directory: ./js-scraper
        run: npm install

      - name: Install Chromium (Playwright)
        if: steps.gate.outputs.should_run == 'true'
        working-directory: ./js-scraper
        run: npx playwright install --with-deps chromium

      - name: Run scraper
        if: steps.gate.outputs.should_run == 'true'
        working-directory: ./js-scraper
        run: node scrape.js

      # Only touches data/js-snapshot.json, so rebasing onto a moved main can't
      # conflict — retry instead of losing the run (same as scrape-li.yml).
      - name: Commit updated snapshot
        if: steps.gate.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/js-snapshot.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Refresh js-snapshot.json"
          attempts=6
          for attempt in $(seq 1 "$attempts"); do
            if git push; then
              echo "Pushed on attempt $attempt/$attempts."
              exit 0
            fi
            if [ "$attempt" -eq "$attempts" ]; then
              break
            fi
            echo "Push rejected on attempt $attempt/$attempts — main moved since checkout. Rebasing onto origin/main and retrying..."
            git fetch origin main
            if ! git rebase origin/main; then
              echo "::error::Unexpected rebase conflict while replaying the js-snapshot.json commit — something else changed data/js-snapshot.json on main. Aborting rather than guessing."
              git rebase --abort
              exit 1
            fi
            sleep $(( (RANDOM % 20) + 5 ))
          done
          echo "::error::Failed to push after $attempts attempts — main kept moving. This run's snapshot was NOT saved."
          exit 1
