name: LI-Coverage

on:
  schedule:
    - cron: "3,18,33,48 * * * *"
  push:
    paths:
      - "li/scrape.py"
      - "li/match.py"
      - "li/companies.py"
      - "li/requirements.txt"
      - "li/li_guest.py"
      - "li/roles.py"
      - "data/companies.json"
  workflow_dispatch: {}

concurrency:
  group: li
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: li
    steps:
      - name: Gate on elapsed time since last real run
        id: gate
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SNAPSHOT_PATH: data/li-snapshot.json
          SCHEDULE_INTERVAL_HOURS: "2"
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ]; then
            STATE=$(curl -sS -m 10 -A "ProPath-Scraper/1.0 (+GitHub Actions)" \
              "https://isubakoa.com/propath/scraper-control.php?scraper=li" || true)
            if [ "$(echo "$STATE" | jq -r '.paused // false' 2>/dev/null || echo false)" = "true" ]; then
              echo "Paused in ProPath Settings (until: $(echo "$STATE" | jq -r '.until // "resumed by hand"')) — skipping."
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          LAST_ISO=$(curl -sS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.raw+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${SNAPSHOT_PATH}?ref=main" \
            | jq -r '.openMarket.sourceHealth.checkedAt // ""' 2>/dev/null || true)
          if [ -z "$LAST_ISO" ]; then
            RESP=$(curl -sS \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits?path=${SNAPSHOT_PATH}&sha=main&per_page=1")
            LAST_ISO=$(echo "$RESP" | jq -r 'if (type == "array") and (length > 0) then .[0].commit.committer.date else "" end')
          fi
          if [ -z "$LAST_ISO" ]; then
            echo "No prior commit found for $SNAPSHOT_PATH on main — treating as first-ever run."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            LAST_EPOCH=$(date -u -d "$LAST_ISO" +%s)
            NOW_EPOCH=$(date -u +%s)
            ELAPSED=$(( NOW_EPOCH - LAST_EPOCH ))
            THRESHOLD=$(( SCHEDULE_INTERVAL_HOURS * 3600 ))
            echo "Last run of $SNAPSHOT_PATH: $LAST_ISO (${ELAPSED}s ago; threshold ${THRESHOLD}s)"
            if [ "$ELAPSED" -ge "$THRESHOLD" ]; then
              echo "should_run=true" >> "$GITHUB_OUTPUT"
            else
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              echo "Only ${ELAPSED}s since the last real run — skipping this check-in."
            fi
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.should_run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.should_run == 'true'
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.gate.outputs.should_run == 'true'
        run: pip install -r requirements.txt

      - name: Validate companies.json
        if: steps.gate.outputs.should_run == 'true'
        run: python test_companies_json.py

      - name: Run offline matching tests
        if: steps.gate.outputs.should_run == 'true'
        run: python test_match.py

      - name: Run offline rotation/merge tests
        if: steps.gate.outputs.should_run == 'true'
        run: python test_rotation.py

      - name: Run offline LI/Indeed tests
        if: steps.gate.outputs.should_run == 'true'
        run: python test_li.py

      - name: Run scraper
        if: steps.gate.outputs.should_run == 'true'
        run: python scrape.py

      - name: Commit updated snapshot
        if: steps.gate.outputs.should_run == 'true'
        working-directory: .
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/li-snapshot.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Refresh li-snapshot.json"
          attempts=6
          for attempt in $(seq 1 "$attempts"); do
            if git push; then
              echo "Pushed on attempt $attempt/$attempts."
              exit 0
            fi
            if [ "$attempt" -eq "$attempts" ]; then
              break
            fi
            echo "Push rejected on attempt $attempt/$attempts — main moved since checkout. Rebasing onto origin/main and retrying..."
            git fetch origin main
            if ! git rebase origin/main; then
              echo "::error::Unexpected rebase conflict while replaying the li-snapshot.json commit — something else changed data/li-snapshot.json on main. Aborting rather than guessing."
              git rebase --abort
              exit 1
            fi
            sleep $(( (RANDOM % 20) + 5 ))
          done
          echo "::error::Failed to push after $attempts attempts — main kept moving. This run's snapshot was NOT saved."
          exit 1
