name: Validate

on:
  push:
    paths:
      - "data/companies.json"
      - "js/scrape.js"
      - "li/*.py"
      - ".github/workflows/validate.yml"
  pull_request:
  workflow_dispatch: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: li
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate companies.json
        run: python test_companies_json.py
      - name: Company matching tests
        run: python test_match.py
