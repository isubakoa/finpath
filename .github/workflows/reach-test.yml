# One-off test: can GitHub's servers reach isubakoa.com through Cloudflare?
# Run it by hand (Actions -> Reach test -> Run workflow). It only makes three GET
# requests and prints what came back; no checkout, no commits. Delete it afterwards.
name: Reach test

on:
  workflow_dispatch: {}

permissions: {}

jobs:
  reach:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Request the site from GitHub
        run: |
          probe() {
            label="$1"; url="$2"; ua="$3"
            headers=$(mktemp); body=$(mktemp)
            code=$(curl -sS -m 20 -A "$ua" -D "$headers" -o "$body" -w '%{http_code}' "$url" || echo "000")
            mitigated=$(grep -i '^cf-mitigated:' "$headers" | tr -d '\r' | cut -d' ' -f2-)
            title=$(grep -io '<title>[^<]*' "$body" | head -1 | sed 's/<title>//I')
            echo "$label"
            echo "  URL:          $url"
            echo "  HTTP status:  $code"
            echo "  cf-mitigated: ${mitigated:-none}"
            echo "  Page title:   ${title:-(none)}"
            echo
          }
          probe "1. ZenPath sign-in page (scraper-style client)" "https://isubakoa.com/zenpath/" "ZenPath-Scraper/1.0 (+GitHub Actions)"
          probe "2. Future switch address (expected: 404 from your server, not a Cloudflare page)" "https://isubakoa.com/zenpath/scraper-control.php" "ZenPath-Scraper/1.0 (+GitHub Actions)"
          probe "3. Sign-in page with curl's default client name" "https://isubakoa.com/zenpath/" "curl/8"
          echo "Reading the result:"
          echo "  200 + sign-in page title, and 404 for #2 -> GitHub gets through; the switch will work."
          echo "  403/503, a 'cf-mitigated' value, or a title like 'Just a moment...' -> Cloudflare is blocking GitHub."
